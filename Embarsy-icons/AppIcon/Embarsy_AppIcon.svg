<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Embarsy macOS app icon (master).
    Apple Big Sur icon grid: 1024 canvas, squircle 824x824 centered (100px margins),
    corner radius 185.4. Mark = "Vector Ears" (same 96-unit path as EmbarsyMark.swift /
    Toolbar/EmbarsyIndex_Template.svg), teal #14B8A6 on the brand dark gradient,
    scaled so the mark spans ~62% of the squircle width.
    Rasters in Embarsy.iconset are rendered per-size from this geometry.
    The mark spans ~74% of the squircle width — the proportion of the original icon.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31363C"/>
      <stop offset="1" stop-color="#16191D"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4" fill="url(#bg)"/>
  <!-- scale = 824 * 0.74 / 70 ≈ 8.7109; mark visual center (48,48) -> canvas center (512,512) -->
  <g transform="translate(512 512) scale(8.7109) translate(-48 -48)">
    <path d="M16 65.5 L32 30.5 L48 57.5 L64 30.5 L80 65.5 M80 65.5 L79 51.5 M80 65.5 L70 55.5"
          fill="none" stroke="#14B8A6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="64.5" r="3.4" fill="#14B8A6"/>
    <circle cx="59" cy="64.5" r="3.4" fill="#14B8A6"/>
  </g>
</svg>
